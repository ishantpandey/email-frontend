name: Deploy Frontend

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/email-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          

  deploy:
    runs-on: self-hosted
    needs: build

    steps:
      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" \
            --password-stdin

      - name: Deploy Frontend
        run: |
          docker network create mern-net 2>/dev/null || true

          docker stop email-frontend || true
          docker rm email-frontend || true

          docker pull ${{ secrets.DOCKER_USERNAME }}/email-frontend:latest

          docker run -d \
            --name email-frontend \
            --restart unless-stopped \
            --network mern-net \
            -p 3000:3000 \
            ${{ secrets.DOCKER_USERNAME }}/email-frontend:latest

      - name: Remove Unused Docker Images
        run: docker image prune -af